name: Update language percentages

on:
  # Recalculate every Monday. You can also run it manually in Actions.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

# This permission applies only to publishing the generated SVG to this repository.
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate private-safe language chart
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          STATS_TOKEN_2: ${{ secrets.STATS_TOKEN_2 }} # Optional: second resource owner
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/language_chart.py

      - name: Publish chart (no source files or private repo names)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add languages.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: update language percentages"
            git push
          fi
